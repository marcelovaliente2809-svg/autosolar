[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "autosolar"
version = "0.1.0"
description = "Herramienta de evaluación técnico-económica de autogeneración solar con almacenamiento para usuarios industriales (AGPE, Colombia)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "scipy>=1.11",
    "pvlib>=0.11",
    "numpy-financial>=1.0",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "requests>=2.31",
    "matplotlib>=3.8",
    "holidays>=0.50",
    "fastapi>=0.110",  # Vercel instala desde pyproject.toml, no desde requirements.txt
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "ipykernel>=6.29", "httpx>=0.27"]
api = ["uvicorn>=0.29"]
ui = ["streamlit>=1.35", "plotly>=5.20"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]  # para importar api.index en los tests

[tool.ruff]
line-length = 100
target-version = "py311"
